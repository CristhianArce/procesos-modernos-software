# Blueprint de Render: ejecuta la imagen publicada por cd.yml en ghcr.io (el paquete es público).
# Los servicios basados en imagen no se redespliegan solos al publicar una imagen nueva:
# hay que usar "Manual Deploy" en el panel o llamar al deploy hook del servicio.
# Todavía sin base de datos: la app solo usa /api/health hasta la HU 3. La base se agrega
# aquí cuando exista la primera migración (la base gratuita de Render vence a los 30 días).
services:
  - type: web
    name: tablero
    runtime: image
    image:
      url: ghcr.io/cristhianarce/procesos-modernos-software:latest
    plan: free
    region: virginia
    healthCheckPath: /api/health
    envVars:
      # Mismo puerto que EXPOSE y ENV PORT del Dockerfile (Render usa 10000 si no se indica).
      - key: PORT
        value: 3000
      # Render genera valores aleatorios la primera vez; nunca van en el repositorio.
      - key: SESSION_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
