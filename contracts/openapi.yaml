openapi: 3.1.0
info:
  title: Tablero de sensores eléctricos
  version: 0.1.0
  description: >-
    Único archivo compartido entre historias (CLAUDE.md §4). Cada historia agrega sus rutas
    bajo `paths` y conserva las de las demás.
components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: sesion
    tokenMetricas:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    NoAutenticado:
      description: Sin sesión o token válido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SinPermiso:
      description: La sesión no tiene el rol exigido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /api/auth/login:
    post:
      summary: Iniciar sesión con nombre de usuario y contraseña
      description: >-
        Crea la cookie de sesión `httpOnly` (8 horas). Tras 5 intentos fallidos en un minuto,
        por IP o por usuario, responde 429 aunque la contraseña sea correcta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, contrasena]
              properties:
                usuario:
                  type: string
                  minLength: 1
                  maxLength: 64
                contrasena:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Sesión iniciada; la cookie `sesion` viaja en `Set-Cookie`
          content:
            application/json:
              schema:
                type: object
                required: [usuario, rol]
                properties:
                  usuario:
                    type: string
                  rol:
                    type: string
                    enum: [administrador, tecnico]
        "400":
          description: Falta el usuario o la contraseña, o el cuerpo no es JSON
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                  detalles:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensaje:
                          type: string
        "401":
          description: Usuario inexistente o contraseña incorrecta (mismo mensaje en ambos casos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Demasiados intentos fallidos
          headers:
            Retry-After:
              description: Segundos de espera antes de volver a intentar
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/logout:
    post:
      summary: Cerrar sesión
      description: Elimina la cookie de sesión. Es idempotente y no exige sesión.
      security: []
      responses:
        "200":
          description: Cookie de sesión vencida en `Set-Cookie`
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /api/health:
    get:
      summary: Salud de la app
      security: []
      responses:
        "200":
          description: La app responde
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
  /api/metrics:
    get:
      summary: Métricas en formato Prometheus
      security:
        - tokenMetricas: []
      responses:
        "200":
          description: Métricas en formato de texto de Prometheus
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/NoAutenticado"
