openapi: 3.1.0
info:
  title: Tablero de sensores eléctricos
  version: 0.1.0
  description: >-
    Único archivo compartido entre historias (CLAUDE.md §4). Cada historia agrega sus rutas
    bajo `paths` y conserva las de las demás.
components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: sesion
    tokenMetricas:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ErrorValidacion:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detalles:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string
    Nodo:
      type: object
      required: [id, nombre, ubicacion, estado, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        ubicacion:
          type: [string, "null"]
        estado:
          type: string
          enum: [conectado, desconectado]
        creadoEn:
          type: string
          format: date-time
    NodoCrear:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        ubicacion:
          type: [string, "null"]
          maxLength: 120
    NodoEditar:
      type: object
      description: Al menos un campo. El estado no se edita aquí.
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        ubicacion:
          type: [string, "null"]
          maxLength: 120
    EstadoNodoCambiar:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [conectado, desconectado]
    EstadoNodoActual:
      type: object
      required: [id, estado]
      properties:
        id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [conectado, desconectado]
    Lectura:
      type: object
      required: [id, sensorId, voltaje, corriente, potencia, tomadaEn]
      properties:
        id:
          type: string
          format: uuid
        sensorId:
          type: string
          format: uuid
        voltaje:
          type: number
        corriente:
          type: number
        potencia:
          type: number
        tomadaEn:
          type: string
          format: date-time
    Alerta:
      type: object
      description: Una lectura superó el umbral máximo de su sensor en una magnitud. Una sola severidad y sin estado.
      required: [id, sensorId, magnitud, valor, umbral, creadaEn]
      properties:
        id:
          type: string
          format: uuid
        sensorId:
          type: string
          format: uuid
        magnitud:
          type: string
          enum: [voltaje, corriente, potencia]
        valor:
          type: number
        umbral:
          type: number
        creadaEn:
          type: string
          format: date-time
    LecturaHistorico:
      type: object
      required: [id, nodoId, nodoNombre, sensorId, sensorNombre, voltaje, corriente, potencia, tomadaEn]
      properties:
        id:
          type: string
          format: uuid
        nodoId:
          type: string
          format: uuid
        nodoNombre:
          type: string
        sensorId:
          type: string
          format: uuid
        sensorNombre:
          type: string
        voltaje:
          type: number
        corriente:
          type: number
        potencia:
          type: number
        tomadaEn:
          type: string
          format: date-time
    HistoricoPagina:
      type: object
      required: [pagina, porPagina, total, totalPaginas, lecturas]
      properties:
        pagina:
          type: integer
          minimum: 1
        porPagina:
          type: integer
          enum: [25]
        total:
          type: integer
          minimum: 0
        totalPaginas:
          type: integer
          minimum: 0
        lecturas:
          description: De la más reciente a la más antigua; vacía si la página es posterior a la última.
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/LecturaHistorico"
    Afectado:
      type: object
      required: [id, alias]
      properties:
        id:
          type: string
          format: uuid
        alias:
          type: string
          minLength: 1
          maxLength: 80
    AfectadosNodo:
      type: object
      required: [total, afectados]
      properties:
        total:
          type: integer
          minimum: 0
        afectados:
          description: Ordenados por alias y, entre alias repetidos, por id.
          type: array
          items:
            $ref: "#/components/schemas/Afectado"
    Notificacion:
      type: object
      description: Aviso de una alerta para un técnico. El sensor es una copia de su nombre; no guarda umbral ni nodo.
      required: [id, sensor, magnitud, valor, creadaEn, leida]
      properties:
        id:
          type: string
          format: uuid
        sensor:
          type: string
        magnitud:
          type: string
          enum: [voltaje, corriente, potencia]
        valor:
          type: number
        creadaEn:
          type: string
          format: date-time
          description: Fecha de la alerta que la originó
        leida:
          type: boolean
    CentroNotificaciones:
      type: object
      required: [noLeidas, notificaciones]
      properties:
        noLeidas:
          type: integer
          minimum: 0
        notificaciones:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Notificacion"
    Sensor:
      type: object
      required: [id, nodoId, nombre, umbralVoltaje, umbralCorriente, umbralPotencia, creadoEn, ultimaLectura]
      properties:
        id:
          type: string
          format: uuid
        nodoId:
          type: string
          format: uuid
        nombre:
          type: string
        umbralVoltaje:
          type: [number, "null"]
        umbralCorriente:
          type: [number, "null"]
        umbralPotencia:
          type: [number, "null"]
        creadoEn:
          type: string
          format: date-time
        ultimaLectura:
          description: Última lectura del sensor, o null si aún no tiene.
          oneOf:
            - $ref: "#/components/schemas/Lectura"
            - type: "null"
    SensorCrear:
      type: object
      required: [nodoId, nombre]
      properties:
        nodoId:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        umbralVoltaje:
          type: [number, "null"]
          exclusiveMinimum: 0
        umbralCorriente:
          type: [number, "null"]
          exclusiveMinimum: 0
        umbralPotencia:
          type: [number, "null"]
          exclusiveMinimum: 0
    SensorEditar:
      type: object
      description: Al menos un campo. Un umbral en null lo quita. El nodo no se edita.
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        umbralVoltaje:
          type: [number, "null"]
          exclusiveMinimum: 0
        umbralCorriente:
          type: [number, "null"]
          exclusiveMinimum: 0
        umbralPotencia:
          type: [number, "null"]
          exclusiveMinimum: 0
    TipoNodo:
      type: string
      description: Símbolo del nodo en el mímico, del origen de la energía al consumo.
      enum: [generacion, subestacion, transformador, alimentador, carga]
    Posicion:
      type: object
      required: [tipo, x, y]
      properties:
        tipo:
          $ref: "#/components/schemas/TipoNodo"
        x:
          type: number
          minimum: 0
          maximum: 2000
        "y":
          type: number
          minimum: 0
          maximum: 2000
    PosicionGuardada:
      allOf:
        - $ref: "#/components/schemas/Posicion"
        - type: object
          required: [nodoId]
          properties:
            nodoId:
              type: string
              format: uuid
    NodoTopologia:
      type: object
      required: [id, nombre, estado, tipo, x, "y"]
      description: Un nodo aún sin ubicar trae tipo, x e y nulos.
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        estado:
          type: string
          enum: [conectado, desconectado]
        tipo:
          oneOf:
            - $ref: "#/components/schemas/TipoNodo"
            - type: "null"
        x:
          type: [number, "null"]
        "y":
          type: [number, "null"]
    EnlaceCrear:
      type: object
      required: [origenId, destinoId]
      description: El sentido (origen → destino) es el del flujo de energía en el mímico. Los dos nodos deben ser distintos.
      properties:
        origenId:
          type: string
          format: uuid
        destinoId:
          type: string
          format: uuid
    Enlace:
      allOf:
        - $ref: "#/components/schemas/EnlaceCrear"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    Estado:
      type: string
      description: Estado visual del nodo frente a sus umbrales (advertencia desde el 98 %, crítico por encima).
      enum: [sin-datos, normal, advertencia, critico, desconectado]
    NodoVivo:
      type: object
      required: [id, conexion, nivel, voltaje, corriente, potencia, tomadaEn, alertasActivas]
      description: Última lectura agregada del nodo (tensión media, corriente y potencia sumadas), cifras con dos decimales.
      properties:
        id:
          type: string
          format: uuid
        conexion:
          type: string
          enum: [conectado, desconectado]
        nivel:
          $ref: "#/components/schemas/Estado"
        voltaje:
          type: [number, "null"]
        corriente:
          type: [number, "null"]
        potencia:
          type: [number, "null"]
        tomadaEn:
          type: [string, "null"]
          format: date-time
        alertasActivas:
          type: integer
          description: Alertas de los últimos 15 minutos.
    Indicadores:
      type: object
      required: [potenciaTotal, tensionMedia, nodosConectados, nodosDesconectados, nodosTotales, alertasActivas, tendencia]
      properties:
        potenciaTotal:
          type: [number, "null"]
        tensionMedia:
          type: [number, "null"]
        nodosConectados:
          type: integer
        nodosDesconectados:
          type: integer
        nodosTotales:
          type: integer
        alertasActivas:
          type: integer
        tendencia:
          type: object
          description: Últimos 15 minutos en puntos de 30 s, del más antiguo al más reciente.
          properties:
            potencia:
              type: array
              items:
                type: number
            tension:
              type: array
              items:
                type: number
            nodos:
              type: array
              items:
                type: integer
            alertas:
              type: array
              items:
                type: integer
    AlertaReciente:
      type: object
      required: [id, nodoId, nodoNombre, sensorNombre, magnitud, valor, umbral, creadaEn]
      properties:
        id:
          type: string
          format: uuid
        nodoId:
          type: string
          format: uuid
        nodoNombre:
          type: string
        sensorNombre:
          type: string
        magnitud:
          type: string
          enum: [voltaje, corriente, potencia]
        valor:
          type: number
        umbral:
          type: number
        creadaEn:
          type: string
          format: date-time
    InstantaneaViva:
      type: object
      required: [generadaEn, indicadores, nodos, alertas]
      properties:
        generadaEn:
          type: string
          format: date-time
        indicadores:
          $ref: "#/components/schemas/Indicadores"
        nodos:
          type: array
          items:
            $ref: "#/components/schemas/NodoVivo"
        alertas:
          type: array
          description: Las 30 alertas más recientes, la más nueva primero.
          items:
            $ref: "#/components/schemas/AlertaReciente"
    DetalleNodo:
      type: object
      required: [id, sensores, alertas]
      properties:
        id:
          type: string
          format: uuid
        sensores:
          type: array
          items:
            type: object
            required: [id, nombre, umbralVoltaje, umbralCorriente, umbralPotencia, lecturas]
            properties:
              id:
                type: string
                format: uuid
              nombre:
                type: string
              umbralVoltaje:
                type: [number, "null"]
              umbralCorriente:
                type: [number, "null"]
              umbralPotencia:
                type: [number, "null"]
              lecturas:
                type: array
                description: Las 30 más recientes, de la más antigua a la más reciente.
                items:
                  type: object
                  required: [voltaje, corriente, potencia, tomadaEn]
                  properties:
                    voltaje:
                      type: number
                    corriente:
                      type: number
                    potencia:
                      type: number
                    tomadaEn:
                      type: string
                      format: date-time
        alertas:
          type: array
          description: Las 10 alertas más recientes del nodo.
          items:
            $ref: "#/components/schemas/AlertaReciente"
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador UUID. Uno que no existe o está mal formado responde 404.
      schema:
        type: string
    SensorIdConsulta:
      name: sensorId
      in: query
      required: false
      description: Filtra por sensor. Un sensor que no existe devuelve una lista vacía.
      schema:
        type: string
        format: uuid
  responses:
    DatosInvalidos:
      description: Datos inválidos, con el detalle de cada campo; no se guarda nada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorValidacion"
    NoEncontrado:
      description: El identificador no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoAutenticado:
      description: Sin sesión o token válido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SinPermiso:
      description: La sesión no tiene el rol exigido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /api/auth/login:
    post:
      summary: Iniciar sesión con nombre de usuario y contraseña
      description: >-
        Crea la cookie de sesión `httpOnly` (8 horas). Tras 5 intentos fallidos en un minuto,
        por IP o por usuario, responde 429 aunque la contraseña sea correcta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, contrasena]
              properties:
                usuario:
                  type: string
                  minLength: 1
                  maxLength: 64
                contrasena:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Sesión iniciada; la cookie `sesion` viaja en `Set-Cookie`
          content:
            application/json:
              schema:
                type: object
                required: [usuario, rol]
                properties:
                  usuario:
                    type: string
                  rol:
                    type: string
                    enum: [administrador, tecnico]
        "400":
          description: Falta el usuario o la contraseña, o el cuerpo no es JSON
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                  detalles:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                        mensaje:
                          type: string
        "401":
          description: Usuario inexistente o contraseña incorrecta (mismo mensaje en ambos casos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Demasiados intentos fallidos
          headers:
            Retry-After:
              description: Segundos de espera antes de volver a intentar
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/logout:
    post:
      summary: Cerrar sesión
      description: Elimina la cookie de sesión. Es idempotente y no exige sesión.
      security: []
      responses:
        "200":
          description: Cookie de sesión vencida en `Set-Cookie`
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /api/health:
    get:
      summary: Salud de la app
      security: []
      responses:
        "200":
          description: La app responde
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
  /api/metrics:
    get:
      summary: Métricas en formato Prometheus
      security:
        - tokenMetricas: []
      responses:
        "200":
          description: Métricas en formato de texto de Prometheus
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/NoAutenticado"
  /api/nodos:
    get:
      summary: Listar los nodos
      description: Administradores y técnicos.
      security:
        - sesion: []
      responses:
        "200":
          description: Nodos de la red
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nodo"
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      summary: Crear un nodo
      description: Solo administradores. El nodo nace con estado `conectado`.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodoCrear"
      responses:
        "201":
          description: Nodo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nodo"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
  /api/nodos/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Consultar un nodo
      description: Administradores y técnicos.
      security:
        - sesion: []
      responses:
        "200":
          description: El nodo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nodo"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    patch:
      summary: Editar el nombre o la ubicación de un nodo
      description: Solo administradores.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodoEditar"
      responses:
        "200":
          description: Nodo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nodo"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    delete:
      summary: Eliminar un nodo
      description: Solo administradores. Elimina también sus sensores y lecturas.
      security:
        - sesion: []
      responses:
        "204":
          description: Nodo eliminado
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /api/aislamiento/nodos/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      summary: Aislar o reconectar un nodo
      description: >-
        Solo administradores. Cambia el estado del nodo a `desconectado` (aislar) o `conectado` (reconectar);
        la operación es simulada y solo modifica el estado guardado. Pedir el estado que el nodo ya tiene
        responde 200 sin cambiar nada.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstadoNodoCambiar"
      responses:
        "200":
          description: Estado resultante del nodo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoNodoActual"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /api/sensores:
    get:
      summary: Listar los sensores de un nodo
      description: Administradores y técnicos. Cada sensor trae su última lectura.
      security:
        - sesion: []
      parameters:
        - name: nodoId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sensores del nodo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sensor"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    post:
      summary: Agregar un sensor a un nodo
      description: Solo administradores. Responde 404 si el nodo no existe.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorCrear"
      responses:
        "201":
          description: Sensor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /api/sensores/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Consultar un sensor con su última lectura
      description: Administradores y técnicos.
      security:
        - sesion: []
      responses:
        "200":
          description: El sensor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    patch:
      summary: Editar el nombre o los umbrales de un sensor
      description: Solo administradores.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorEditar"
      responses:
        "200":
          description: Sensor actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    delete:
      summary: Eliminar un sensor
      description: Solo administradores. Elimina también sus lecturas.
      security:
        - sesion: []
      responses:
        "204":
          description: Sensor eliminado
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /api/simulador:
    post:
      summary: Simular una lectura por cada sensor de un nodo
      description: >-
        Solo administradores. Registra una lectura de voltaje, corriente y potencia por cada sensor
        del nodo. Un nodo sin sensores responde 200 con cero lecturas.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodoId]
              properties:
                nodoId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Lecturas registradas
          content:
            application/json:
              schema:
                type: object
                required: [lecturas]
                properties:
                  lecturas:
                    type: array
                    items:
                      $ref: "#/components/schemas/Lectura"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /api/afectados:
    get:
      summary: Listar los afectados de un nodo
      description: Administradores y técnicos. Devuelve el total y la lista; un nodo sin afectados responde una lista vacía y total 0.
      security:
        - sesion: []
      parameters:
        - name: nodoId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Afectados del nodo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AfectadosNodo"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /api/historico:
    get:
      summary: Consultar el histórico de lecturas
      description: >-
        Cualquier usuario con sesión. 25 lecturas por página, la más reciente primero. Los filtros se combinan;
        los días se interpretan en la hora de Bogotá e incluyen ambos extremos. Un parámetro vacío no filtra.
      security:
        - sesion: []
      parameters:
        - name: nodoId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sensorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          required: false
          description: Primer día del rango (AAAA-MM-DD), incluido.
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: false
          description: Último día del rango (AAAA-MM-DD), incluido; no puede ser anterior a desde.
          schema:
            type: string
            format: date
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Una página del histórico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricoPagina"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
  /api/historico/exportar:
    get:
      summary: Exportar el histórico de lecturas a CSV
      description: >-
        Cualquier usuario con sesión. Mismos filtros que `/api/historico`, sin paginar: como máximo las 10 000
        lecturas más recientes que los cumplen, la más reciente primero. Columnas nodo, sensor, voltaje, corriente,
        potencia y fecha (ISO 8601 en UTC), separadas por coma; un valor que empieza por =, +, - o @ va precedido
        de un apóstrofo.
      security:
        - sesion: []
      parameters:
        - name: nodoId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sensorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          required: false
          description: Primer día del rango (AAAA-MM-DD), incluido.
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: false
          description: Último día del rango (AAAA-MM-DD), incluido; no puede ser anterior a desde.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Archivo CSV para descargar (historico.csv); sin resultados trae solo el encabezado
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="historico.csv"
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
  /api/lecturas:
    get:
      summary: Listar las lecturas más recientes
      description: Administradores y técnicos. De la más reciente a la más antigua.
      security:
        - sesion: []
      parameters:
        - $ref: "#/components/parameters/SensorIdConsulta"
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Lecturas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lectura"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
  /api/alertas:
    get:
      summary: Listar las alertas por umbral más recientes
      description: Administradores y técnicos. De la más reciente a la más antigua.
      security:
        - sesion: []
      parameters:
        - $ref: "#/components/parameters/SensorIdConsulta"
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Alertas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alerta"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
  /api/notificaciones:
    get:
      summary: Consultar las notificaciones propias y cuántas están sin leer
      description: >-
        Solo técnicos. El destinatario es el de la sesión; la API no acepta un destinatario del cliente.
        Devuelve las 50 más recientes, de la más reciente a la más antigua; `noLeidas` cuenta todas las no leídas.
      security:
        - sesion: []
      responses:
        "200":
          description: Notificaciones del técnico de la sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentroNotificaciones"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
  /api/notificaciones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador UUID de la notificación. Uno mal formado responde 400.
        schema:
          type: string
          format: uuid
    patch:
      summary: Marcar como leída una notificación propia
      description: >-
        Solo técnicos. Sin cuerpo (si llega uno, se ignora). El destinatario es el de la sesión. Marcar una ya
        leída responde 200 sin cambiar nada. Una notificación de otro técnico o que no existe responde 404, sin
        revelar si existe.
      security:
        - sesion: []
      responses:
        "200":
          description: La notificación, ya leída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notificacion"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /api/topologia:
    get:
      summary: Consultar la topología de la red para el mímico
      description: Administradores y técnicos. Todos los nodos, con su posición si la tienen, y los enlaces.
      security:
        - sesion: []
      responses:
        "200":
          description: Nodos y enlaces
          content:
            application/json:
              schema:
                type: object
                required: [nodos, enlaces]
                properties:
                  nodos:
                    type: array
                    items:
                      $ref: "#/components/schemas/NodoTopologia"
                  enlaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Enlace"
        "401":
          $ref: "#/components/responses/NoAutenticado"
  /api/topologia/nodos/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      summary: Ubicar un nodo en el mímico
      description: Solo administradores. Crea o reemplaza el tipo y la posición del nodo.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Posicion"
      responses:
        "200":
          description: Posición guardada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosicionGuardada"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /api/topologia/enlaces:
    post:
      summary: Crear un enlace entre dos nodos
      description: Solo administradores. Hay como máximo un enlace por par de nodos, sin importar el sentido.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnlaceCrear"
      responses:
        "201":
          description: Enlace creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enlace"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Ya existe un enlace entre esos nodos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/topologia/enlaces/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      summary: Borrar un enlace
      description: Solo administradores.
      security:
        - sesion: []
      responses:
        "204":
          description: Enlace borrado
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /api/estado:
    get:
      summary: Instantánea compacta del estado de la red
      description: >-
        Administradores y técnicos. La consulta el cliente cada 2,5 s (Cache-Control no-store): por nodo, su
        conexión, su última lectura agregada y su nivel frente a los umbrales; los indicadores y las alertas recientes.
      security:
        - sesion: []
      responses:
        "200":
          description: Instantánea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantaneaViva"
        "401":
          $ref: "#/components/responses/NoAutenticado"
  /api/estado/nodos/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Detalle en vivo de un nodo para el panel lateral del mímico
      description: Administradores y técnicos. Sensores con umbrales y últimas lecturas, y alertas recientes del nodo.
      security:
        - sesion: []
      responses:
        "200":
          description: Detalle del nodo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetalleNodo"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
