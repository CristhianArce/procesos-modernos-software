# CI mínimo: rápido en cada PR; los controles de seguridad corren solo al fusionar en main.
# El job proyecto levanta Postgres de servicio y aplica las migraciones con Flyway para las pruebas
# de integración con base de datos (desde la HU 3). CodeQL y el script de orden de migraciones siguen diferidos.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuracion-ia:
    name: Configuración de IA (OpenSpec y Claude Code)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Instalar OpenSpec 2.1
        run: npm i -g @fission-ai/openspec@2.1
      - name: Pruebas de la configuración (node --test)
        run: node --test ".claude/tests/*.test.mjs"
      - name: Validación estricta de OpenSpec
        run: openspec validate --all --strict --no-interactive

  proyecto:
    name: Proyecto (lint, typecheck, pruebas, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Base desechable solo para este job; las credenciales no protegen nada.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Pruebas unitarias
        run: npm run test:unit
      # Mismas migraciones y misma imagen de Flyway que docker compose (db/migration, inmutables).
      - name: Aplicar las migraciones (Flyway)
        run: |
          docker run --rm --network host -v "$PWD/db/migration:/flyway/sql:ro" \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/ci \
            -e FLYWAY_USER=ci -e FLYWAY_PASSWORD=ci \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/sql \
            flyway/flyway:11 migrate
      - name: Pruebas de integración
        run: npm run test:integration
      - name: Build
        run: npm run build
      # E2E contra la app construida arriba, con la BD ya migrada y sembrada (cuentas de demostración del README).
      - name: Cargar la semilla
        run: npm run seed
      - name: Instalar el navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas e2e (Playwright)
        env:
          SESSION_SECRET: ci-e2e-secret-solo-para-pruebas-0123456789
          METRICS_TOKEN: ci
          BASE_URL: http://localhost:3000
        run: |
          npm start > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 1
          done
          npm run e2e
      - name: Log de la app
        if: failure()
        run: tail -n 80 app.log
      - name: Diagnóstico temporal de la ficha del nodo
        if: failure()
        run: |
          curl -sS -c cj -H 'content-type: application/json' -d '{"usuario":"tecnico","contrasena":"Demo-Tecnico-2026"}' http://localhost:3000/api/auth/login
          curl -sS -b cj -o ficha.html -w 'http=%{http_code} ' http://localhost:3000/nodos/00000000-0000-4000-8000-000000000001
          grep -o '<h2[^>]*>[^<]*</h2>' ficha.html || true
          grep -io 'digest[^<]{0,200}' ficha.html | head -5 || true
          grep -o 'aria-label="[^"]*"' ficha.html || true
          grep -o '<main.*</main>' ficha.html | head -c 2500 || true
          grep -o 'Este nodo[^<]*' ficha.html | head -3 || true
          psql "$DATABASE_URL" -c "select count(*) from sensores" -c "select id,nodo_id from sensores limit 3" || true
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  imagen:
    name: Imagen de Docker (build y arranque)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Solo construye: no publica. La publicación en ghcr.io es del CD.
      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tablero:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Valores de relleno: /api/health no usa la BD ni los secretos.
      - name: Arrancar la imagen y consultar /api/health
        run: |
          docker run -d --name app -p 3000:3000 \
            -e DATABASE_URL=postgres://ci:ci@localhost:5432/ci \
            -e SESSION_SECRET=ci -e METRICS_TOKEN=ci tablero:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1

  seguridad:
    name: Seguridad (gitleaks y npm audit)
    # Solo al fusionar en main: mantiene ligero el CI de cada PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (secretos en el historial)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: npm audit (nivel alto o crítico)
        run: npm audit --audit-level=high
