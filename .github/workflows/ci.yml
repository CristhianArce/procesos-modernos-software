# CI mínimo: rápido en cada PR; los controles de seguridad corren solo al fusionar en main.
# La HU 2 agrega después Postgres de servicio, Flyway, CodeQL y el build de la imagen (CD).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuracion-ia:
    name: Configuración de IA (OpenSpec y Claude Code)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Instalar OpenSpec 2.1
        run: npm i -g @fission-ai/openspec@2.1
      - name: Pruebas de la configuración (node --test)
        run: node --test ".claude/tests/*.test.mjs"
      - name: Validación estricta de OpenSpec
        run: openspec validate --all --strict --no-interactive

  proyecto:
    name: Proyecto (lint, typecheck, pruebas, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Pruebas unitarias
        run: npm run test:unit
      # Hoy las pruebas de integración invocan los handlers con Request y no usan BD.
      # Cuando una necesite Postgres (HU 3), la HU 2 agrega el servicio a este job.
      - name: Pruebas de integración
        run: npm run test:integration
      - name: Build
        run: npm run build

  seguridad:
    name: Seguridad (gitleaks y npm audit)
    # Solo al fusionar en main: mantiene ligero el CI de cada PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (secretos en el historial)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: npm audit (nivel alto o crítico)
        run: npm audit --audit-level=high
