# CD: al fusionar en main publica la imagen en GitHub Container Registry.
# Etiquetas: latest y sha-<commit>. El despliegue en un entorno público está pospuesto.
# Los paquetes nuevos nacen privados: la primera vez hay que marcarlo público
# (perfil del propietario > Packages > procesos-modernos-software > Package settings).
name: CD

on:
  push:
    branches: [main]
    # Los merges que solo tocan documentación, specs o evidencias no republican.
    paths-ignore:
      - "openspec/**"
      - "evidencias/**"
      - "AGENTS_LOG.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# Un solo CD a la vez; uno nuevo espera, no cancela una publicación a medias.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar la imagen en ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      # ghcr.io exige el nombre en minúsculas y el dueño del repositorio puede llevar mayúsculas.
      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGEN=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Comprobar la imagen publicada
        run: docker buildx imagetools inspect ${{ env.IMAGEN }}:latest
