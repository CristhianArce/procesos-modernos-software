# CD: al fusionar en main publica la imagen en GitHub Container Registry.
# Etiquetas: latest y sha-<commit>. Si existe el secreto RENDER_DATABASE_URL, migra y siembra la base de Render;
# si existe RENDER_DEPLOY_HOOK_URL, avisa a Render para redesplegar (siempre después de migrar).
# El paquete hereda la visibilidad del repositorio (público) por la etiqueta
# org.opencontainers.image.source que agrega docker/metadata-action.
name: CD

on:
  push:
    branches: [main]
    # Los merges que solo tocan documentación, specs o evidencias no republican.
    paths-ignore:
      - "openspec/**"
      - "evidencias/**"
      - "AGENTS_LOG.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# Un solo CD a la vez; uno nuevo espera, no cancela una publicación a medias.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar la imagen en ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Opcionales: si un secreto no existe, su paso de Render se omite.
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
      # ghcr.io exige el nombre en minúsculas y el dueño del repositorio puede llevar mayúsculas.
      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGEN=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Comprobar la imagen publicada
        run: docker buildx imagetools inspect ${{ env.IMAGEN }}:latest
      # Migra y siembra la base de Render antes de avisar, para que la imagen nueva encuentre su esquema.
      # RENDER_DATABASE_URL es la "External Database URL" de Render (postgres://usuario:clave@host/bd).
      # Las migraciones son hacia adelante y las semillas idempotentes, así que repetirlas es seguro.
      - name: Migrar y sembrar la base de Render
        if: env.RENDER_DATABASE_URL != ''
        run: |
          set -euo pipefail
          sin_esquema="${RENDER_DATABASE_URL#*://}"
          credenciales="${sin_esquema%%@*}"
          destino="${sin_esquema#*@}"
          usuario="${credenciales%%:*}"
          clave="${credenciales#*:}"
          echo "::add-mask::$clave"
          docker run --rm -v "$PWD/db/migration:/flyway/sql:ro" \
            -e FLYWAY_URL="jdbc:postgresql://${destino}?sslmode=require" \
            -e FLYWAY_USER="$usuario" -e FLYWAY_PASSWORD="$clave" \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/sql \
            flyway/flyway:11 migrate
          for semilla in db/seed/*.sql; do
            [ -e "$semilla" ] || continue
            docker run --rm -v "$PWD/db/seed:/seed:ro" postgres:17-alpine \
              psql "${RENDER_DATABASE_URL}?sslmode=require" -v ON_ERROR_STOP=1 --single-transaction -f "/seed/$(basename "$semilla")"
          done
      # Los servicios de Render basados en imagen no se redespliegan solos al publicar una nueva:
      # el deploy hook vuelve a descargar :latest. La URL es un secreto del repositorio.
      - name: Avisar a Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS --max-time 30 --retry 2 -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
